*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 17px/1.55 var(--body);color:var(--ink);background:var(--marfil);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p{margin:0;font-weight:400}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px;border-radius:10px}
.ico{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}

/* fondo suave con orbes, como la web */
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none}
body::before{width:420px;height:420px;left:-140px;top:38%;background:rgba(139,26,42,.10)}
body::after{width:380px;height:380px;right:-120px;bottom:-60px;background:rgba(184,160,106,.18)}

/* encabezado borgoña */
.hero{position:relative;z-index:1;color:var(--marfil);text-align:center;padding:calc(30px + env(safe-area-inset-top)) 22px 118px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0,#a3243a 0,var(--borg) 52%,#6e1321 100%)}
.hero::before{content:"";position:absolute;right:-30px;top:-30px;width:290px;height:560px;background:var(--oro);opacity:.12;-webkit-mask:var(--iso) center/contain no-repeat;mask:var(--iso) center/contain no-repeat;pointer-events:none;animation:flo 9s ease-in-out infinite}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--oro),transparent)}
.hero>*{position:relative}
.logo{display:block;height:54px;width:auto;margin:0 auto 24px}
.eti{font-size:.8rem;letter-spacing:.34em;color:var(--oro-c);font-weight:700;text-transform:uppercase}
.hero h1{font:400 clamp(3rem,11vw,5.2rem)/.95 var(--display);letter-spacing:.06em;margin:12px 0 14px}
.sub{max-width:34em;margin:0 auto;color:#f1dfe0;font-size:1.06rem}
.hero.slim .eti,.hero.slim h1,.hero.slim .sub{display:none}.hero.slim{padding-bottom:96px}.hero.slim .logo{margin-bottom:0}

/* tarjeta */
.wrap{position:relative;z-index:2;width:min(660px,100% - 28px);margin:-74px auto 0;padding-bottom:calc(46px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,40px);box-shadow:0 2px 0 var(--line),0 40px 70px -36px rgba(94,16,28,.55)}
.sec{padding:26px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:4px}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.sh .n{font:400 2.4rem/1 var(--display);color:var(--oro);letter-spacing:.04em}
.sh h2{font:400 1.7rem/1.1 var(--display);letter-spacing:.07em}
.sh small{display:block;color:var(--muted);font-size:.92rem;margin-top:3px;letter-spacing:0;font-family:var(--body)}
.err{color:var(--borg);font-size:.95rem;font-weight:700;margin-top:10px}
.err:empty{display:none}
.note{display:flex;gap:9px;align-items:flex-start;margin-top:10px;color:var(--muted);font-size:.88rem;line-height:1.45}
.note .ico{margin-top:2px;color:var(--oro)}

/* regalo: solo para personas */
.gift{display:flex;align-items:center;gap:12px;margin-bottom:6px;padding:13px 18px;border-radius:16px;background:linear-gradient(100deg,rgba(184,160,106,.2),rgba(184,160,106,.08));border:1px solid rgba(184,160,106,.55);font-weight:700;font-size:.98rem}
.gift .ico{color:var(--borg);width:1.5em;height:1.5em}

/* elección inicial */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;overflow:hidden;display:grid;justify-items:center;gap:6px;text-align:center;padding:22px 12px 18px;min-height:136px;background:#fff;border:1.5px solid var(--line);border-radius:20px;box-shadow:0 3px 0 var(--line);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s,background .25s}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(139,26,42,.16),transparent 60%);opacity:0;transition:opacity .3s}
.tile:hover::before{opacity:1}
.tile>*{position:relative}
.tile .ico{width:36px;height:36px;color:var(--oro);transition:transform .35s var(--ease),color .25s}
.tile b{font:700 1.02rem/1.2 var(--body)}
.tile small{color:var(--muted);font-size:.86rem;line-height:1.3}
.tile:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--line)}
.tile:hover .ico{transform:scale(1.14) rotate(-5deg)}
.tile:active{transform:translateY(1px) scale(.98)}
.tile[aria-pressed="true"]{border-color:var(--borg);background:linear-gradient(180deg,#fff,#FBF1F0);box-shadow:0 4px 0 rgba(94,16,28,.22),0 18px 30px -18px rgba(139,26,42,.6);transform:translateY(-3px);animation:tpop .45s var(--ease)}
.tile[aria-pressed="true"] .ico{color:var(--borg)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--borg);color:#fff;font-size:.85rem;font-weight:700;display:grid;place-items:center;animation:pop .4s var(--ease)}

/* el resto del formulario aparece al elegir */
.reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .55s var(--ease),opacity .45s}
.reveal.on{grid-template-rows:1fr;opacity:1}
.reveal>div{overflow:hidden;min-height:0}
.reveal.on>div{overflow:visible}
.reveal.sm .in{padding-top:16px}

/* campos */
.fld{display:grid;gap:7px}
.fld label{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lbl{display:block;margin-bottom:10px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fld select{width:100%;min-height:56px;padding:0 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;box-shadow:inset 0 2px 4px rgba(37,37,40,.06);font-size:1.05rem;transition:border-color .2s,box-shadow .2s}
.fld select:focus{outline:0;border-color:var(--borg);box-shadow:0 0 0 4px rgba(139,26,42,.13)}
.fld input,.fld textarea{width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;box-shadow:inset 0 2px 4px rgba(37,37,40,.06);font-size:1.05rem;transition:border-color .2s,box-shadow .2s,transform .2s var(--ease)}
.fld input{min-height:56px}
.fld textarea{min-height:150px;resize:vertical;line-height:1.55}
.fld textarea.s{min-height:104px}
.fld input:focus,.fld textarea:focus{outline:0;border-color:var(--borg);box-shadow:inset 0 2px 4px rgba(37,37,40,.04),0 0 0 4px rgba(139,26,42,.13);transform:translateY(-1px)}
.cnt{justify-self:end;font-size:.82rem;color:var(--muted)}
.two{display:grid;gap:14px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;overflow:hidden;padding:11px 18px;min-height:44px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:.98rem;box-shadow:0 2px 0 var(--line);transition:transform .22s var(--ease),background .22s,color .22s,border-color .22s,box-shadow .22s}
.chip:hover{transform:translateY(-2px);border-color:var(--borg);box-shadow:0 4px 0 var(--line)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--borg);color:var(--marfil);border-color:var(--borg);box-shadow:0 3px 0 var(--borg-o),0 12px 22px -12px rgba(139,26,42,.8);animation:tpop .4s var(--ease)}

/* estrellas */
.stars{display:flex;gap:6px;justify-content:center}
.star{width:clamp(48px,14vw,64px);aspect-ratio:1;display:grid;place-items:center;border:0;background:none;padding:0;transition:transform .25s var(--ease)}
.star svg{width:100%;height:100%;fill:#e4ded2;stroke:#cfc7b6;stroke-width:1;stroke-linejoin:round;transition:fill .25s,stroke .25s,filter .25s}
.star.on svg{fill:url(#gold);stroke:#a58e5a;filter:drop-shadow(0 6px 8px rgba(165,142,90,.5))}
.star:hover{transform:scale(1.14) rotate(-5deg)}
.star.pop{animation:pop .45s var(--ease)}
.slab{text-align:center;font:400 1.7rem/1 var(--display);letter-spacing:.12em;color:var(--borg);min-height:1.7rem;margin-top:12px}

/* botones: barrido de brillo como en la web */
.send,.btn{position:relative;overflow:hidden;isolation:isolate}
.send::after,.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.send:hover::after,.btn:hover::after{transform:translateX(120%)}
.send{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;min-height:64px;border:1px solid var(--borg-o);border-radius:999px;background:linear-gradient(180deg,#a3243a,var(--borg));color:var(--marfil);font:400 1.6rem/1 var(--display);letter-spacing:.14em;box-shadow:0 5px 0 var(--borg-o),0 22px 30px -16px rgba(139,26,42,.8);transition:transform .25s var(--ease),box-shadow .25s}
.send .ico{transition:transform .3s var(--ease)}
.send:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--borg-o),0 28px 34px -16px rgba(139,26,42,.85)}
.send:hover .ico{transform:translateX(6px)}
.send:active{transform:translateY(3px);box-shadow:0 2px 0 var(--borg-o)}
.send[disabled]{opacity:.8;cursor:wait}
.send[disabled] .ico{animation:spin 1s linear infinite}
.legal{margin-top:16px;color:var(--muted);font-size:.86rem;text-align:center;line-height:1.5}
.top-err{margin-top:14px;padding:12px 16px;border-radius:14px;background:#f8e9e7;border:1px solid #e3b9b4;color:#7a1d1d;font-size:.95rem;text-align:center}

/* gracias */
.ok{text-align:center;padding:10px 0 4px}
.chk{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;background:var(--borg);display:grid;place-items:center;box-shadow:0 18px 30px -16px rgba(94,16,28,.9),0 0 0 8px rgba(184,160,106,.28);animation:pop .6s var(--ease)}
.chk svg{width:46px;height:46px;stroke:var(--oro-c);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .7s .25s var(--ease) forwards}
.ok h2{font:400 clamp(2.4rem,9vw,3.4rem)/1 var(--display);letter-spacing:.07em}
.ok .lead{color:var(--muted);margin:10px auto 26px;max-width:29em}
.ticket{position:relative;display:grid;grid-template-columns:1fr auto;text-align:left;background:linear-gradient(135deg,#a3243a,var(--borg) 55%,#6e1321);color:var(--marfil);border-radius:22px;box-shadow:0 26px 40px -22px rgba(94,16,28,.9);animation:up .7s .2s var(--ease) both}
.ticket::before,.ticket::after{content:"";position:absolute;right:calc(34% - 11px);width:22px;height:22px;border-radius:50%;background:var(--card);z-index:1}
.ticket::before{top:-11px}.ticket::after{bottom:-11px}
.tk-a{padding:24px 24px 22px}
.tk-a small{display:block;color:var(--oro-c);letter-spacing:.3em;font-size:.72rem;font-weight:700}
.tk-a .cd{font:400 clamp(1.7rem,7.2vw,2.7rem)/1.05 var(--display);letter-spacing:.08em;margin:8px 0 6px;white-space:nowrap}
.tk-a p{color:#f1dfe0;font-size:.92rem}.tk-a p.vig{margin:8px 0 0;color:var(--oro-c);font-size:.95rem}
.tk-b{display:grid;place-items:center;padding:14px 24px;border-left:2px dashed rgba(245,242,238,.35);min-width:34%;text-align:center}
.tk-b b{display:block;font:400 3.2rem/1 var(--display);color:var(--oro-c);letter-spacing:.04em}
.tk-b span{font-size:.72rem;letter-spacing:.24em;color:#f1dfe0}
.usos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;text-align:left}
.uso{display:flex;gap:11px;align-items:flex-start;padding:14px 15px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:.92rem;line-height:1.35;transition:transform .25s var(--ease)}
.uso:hover{transform:translateY(-2px)}
.uso .ico{color:var(--borg);width:1.5em;height:1.5em;margin-top:1px}
.uso b{display:block;font-size:.98rem}
.uso span{color:var(--muted)}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 24px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:1rem;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--line);transition:transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.o{background:linear-gradient(180deg,#a3243a,var(--borg));border-color:var(--borg-o);color:var(--marfil);box-shadow:0 3px 0 var(--borg-o)}
.btn.o:hover{box-shadow:0 6px 0 var(--borg-o)}
.btn.w{background:#1f8f55;border-color:#1f8f55;color:#fff;box-shadow:0 3px 0 #146a3c}
.btn.w:hover{box-shadow:0 6px 0 #146a3c}
.fine{margin-top:22px;color:var(--muted);font-size:.9rem}
.again{margin-top:14px;background:none;border:0;color:var(--borg);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:.92rem}

.no{text-align:center;padding:12px 0}
.no h2{font:400 2.2rem/1.05 var(--display);letter-spacing:.07em;margin:6px 0 10px}
.no p{color:var(--muted);max-width:28em;margin:0 auto}
.foot{text-align:center;color:var(--muted);font-size:.85rem;margin-top:26px;letter-spacing:.06em}
.foot b{font:400 1rem/1 var(--display);letter-spacing:.2em;color:var(--ink)}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes tpop{0%{transform:scale(.94)}60%{transform:translateY(-5px) scale(1.03)}100%{transform:translateY(-3px) scale(1)}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.card>*{animation:up .6s var(--ease) both}
@media (max-width:480px){.tiles{gap:10px}.usos{grid-template-columns:1fr}.ticket{grid-template-columns:1fr}.ticket::before,.ticket::after{display:none}.tk-b{border-left:0;border-top:2px dashed rgba(245,242,238,.35);padding:16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.chk svg{stroke-dashoffset:0}.reveal{opacity:1}}

/* ===== OPCIÓN B · compacta ===== */
.hero{padding:calc(18px + env(safe-area-inset-top)) 20px 78px}
.hero.slim{padding-bottom:78px}
.logo{height:38px;margin:0 auto 10px}
.hero .eti{font-size:.7rem;letter-spacing:.3em}
.hero h1{font-size:clamp(2.1rem,6.5vw,3rem);margin:6px 0 0}
.hero .sub{display:none}
.hero.slim .eti,.hero.slim h1{display:block}
.wrap{width:min(780px,100% - 24px);margin-top:-52px}
.card{position:relative;overflow:hidden;padding:clamp(18px,3.4vw,28px);border-radius:24px;animation:none}
.card>*{animation:none}
.card:has(.ok) .bgi,.card:has(.no) .bgi{display:none}
.bgi{position:absolute;inset:0;z-index:0;pointer-events:none}
.bgi::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 80% at 85% 40%,var(--acc,rgba(184,160,106,.35)),transparent 70%);opacity:.55;transition:background .8s}
.bgi::after{content:"";position:absolute;inset:0;background:rgba(251,249,244,.8)}
.bgl{position:absolute;z-index:0;right:-4%;top:50%;height:112%;aspect-ratio:1;opacity:0;transform:translateY(-50%) scale(.86) rotate(-8deg);transition:opacity .8s var(--ease),transform 1.1s var(--ease);color:var(--c,var(--borg))}
.bgl.on{opacity:1;transform:translateY(-50%) scale(1) rotate(0)}
.bgl svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:.55;stroke-linecap:round;stroke-linejoin:round}
.bgl.iso{background:currentColor;-webkit-mask:var(--iso) center/contain no-repeat;mask:var(--iso) center/contain no-repeat;color:var(--oro);height:120%;opacity:0}
.bgl.iso.on{opacity:.55}
#app{position:relative;z-index:1}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f .span{grid-column:1/-1}
.f .sec{padding:0;border:0}
.f label,.f .lbl{display:block;margin:0 0 5px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.f label small{text-transform:none;letter-spacing:0;font-weight:400}
.f input,.f textarea,.f select{width:100%;padding:0 14px;min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:rgba(255,255,255,.92);box-shadow:inset 0 1px 3px rgba(37,37,40,.06);font-size:1rem;transition:border-color .2s,box-shadow .2s}
.f textarea{padding:11px 14px;min-height:0;resize:vertical;line-height:1.45}
.f input:focus,.f textarea:focus,.f select:focus{outline:0;border-color:var(--oro);box-shadow:0 0 0 4px rgba(184,160,106,.22);transform:none}
.f .need{border-color:var(--oro)!important;box-shadow:0 0 0 4px rgba(184,160,106,.22)!important}
.f .err{color:#8a7440;font-weight:400;font-size:.8rem;margin-top:5px}
.f .err::before{content:"· "}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(37,37,40,.07)}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:.95rem;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--borg);box-shadow:0 2px 8px -2px rgba(37,37,40,.25)}
.gift{margin:0;padding:9px 14px;font-size:.88rem;border-radius:12px}
.gift .ico{width:1.3em;height:1.3em}
/* menú de producciones */
.dd{position:relative}
.dd-b{width:100%;display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px 6px 14px;border:1.5px solid var(--line);border-radius:12px;background:rgba(255,255,255,.92);box-shadow:inset 0 1px 3px rgba(37,37,40,.06);text-align:left;font-size:1rem;transition:border-color .2s,box-shadow .2s}
.dd-b:focus-visible,.dd.open .dd-b{outline:0;border-color:var(--oro);box-shadow:0 0 0 4px rgba(184,160,106,.22)}
.dd-v{flex:1;display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.dd-v .ph{color:#9a968c}
.tg{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--borg);color:var(--marfil);font-size:.84rem;line-height:1.3}
.tg .ico{width:1em;height:1em}
.dd-b>.ico{color:var(--muted);transition:transform .3s var(--ease)}
.dd.open .dd-b>.ico{transform:rotate(180deg)}
.dd-p{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);max-height:min(330px,52vh);overflow:auto;padding:6px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 24px 40px -18px rgba(37,37,40,.45);opacity:0;transform:translateY(-6px);visibility:hidden;transition:opacity .2s,transform .25s var(--ease),visibility .2s}
.dd.open .dd-p{opacity:1;transform:none;visibility:visible}
.dd-p.up{top:auto;bottom:calc(100% + 6px)}
.op{width:100%;display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:.98rem;transition:background .15s}
.op:hover,.op:focus-visible{background:rgba(184,160,106,.18);outline:0}
.op .ico{width:1.35em;height:1.35em;color:var(--oro)}
.op span{flex:1}
.op i{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.75rem;color:transparent;background:#fff;transition:all .2s}
.dd.single .op i{border-radius:50%}
.op[aria-selected="true"]{background:rgba(139,26,42,.07)}
.op[aria-selected="true"] .ico{color:var(--borg)}
.op[aria-selected="true"] i{background:var(--borg);border-color:var(--borg);color:#fff}
.hint{display:block;margin-top:5px;font-size:.78rem;color:var(--muted)}
/* estrellas compactas */
.rate{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rate .stars{justify-content:flex-start;gap:2px}
.rate .star{width:34px}
.rate .slab{margin:0;font-size:1.25rem;min-height:0;text-align:left}
.cnt{font-size:.74rem}
.f .note{margin-top:6px;font-size:.8rem}
.send{min-height:52px;font-size:1.4rem;box-shadow:0 4px 0 var(--borg-o),0 16px 24px -14px rgba(139,26,42,.8)}
.legal{margin-top:10px;font-size:.78rem}
.top-err{background:rgba(184,160,106,.16);border-color:rgba(184,160,106,.6);color:#6a5a2c}
@media (max-width:640px){.f{grid-template-columns:1fr}.bgl{right:-30%}}

/* ===== B · pizarra + dorado sutil ===== */
.card:has(.f){background:linear-gradient(160deg,#2d2d31,var(--pizarra) 55%,#1d1d20);color:var(--marfil);border-color:rgba(184,160,106,.35);box-shadow:0 2px 0 rgba(0,0,0,.35),0 40px 70px -30px rgba(0,0,0,.65),inset 0 1px 0 rgba(245,242,238,.08)}
.bgi::before{background:radial-gradient(70% 70% at 8% 100%,rgba(184,160,106,.16),transparent 70%);opacity:1}
.bgi::after{background:rgba(37,37,40,.12)}
.bgl{--c:var(--oro)!important;color:var(--oro)!important;right:auto;left:-9%;top:auto;bottom:-20%;height:82%;transform:translateY(24px) scale(.9) rotate(-8deg);transform-origin:20% 80%}
.bgl.on{opacity:.2;transform:none}
.bgl svg{stroke-width:.6}
.bgl.iso{left:-8%;bottom:-18%;height:84%}
.bgl.iso.on{opacity:.16}
.card:has(.f) .f label,.card:has(.f) .f .lbl{color:var(--oro-c)}
.card:has(.f) .f label small{color:rgba(245,242,238,.6)}
.f input,.f textarea,.f select,.dd-b{background:rgba(245,242,238,.08);border:1.5px solid rgba(245,242,238,.26);color:var(--marfil);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.f input::placeholder,.f textarea::placeholder{color:rgba(245,242,238,.5)}
.f select option{background:#2a2a2e;color:var(--marfil)}
.f input:focus,.f textarea:focus,.f select:focus,.dd-b:focus-visible,.dd.open .dd-b{border-color:var(--oro);background:rgba(245,242,238,.12);box-shadow:0 0 0 4px rgba(184,160,106,.2)}
.f .need{border-color:var(--oro)!important;box-shadow:0 0 0 4px rgba(184,160,106,.25)!important}
.f .err{color:var(--oro-c)}
.dd-v .ph{color:rgba(245,242,238,.5)}
.dd-b>.ico{color:var(--oro-c)}
.tg{background:var(--oro);color:var(--pizarra);font-weight:700}
.dd-p{background:#2c2c30;border-color:rgba(184,160,106,.35);box-shadow:0 24px 44px -16px rgba(0,0,0,.7)}
.op{color:var(--marfil)}
.op:hover,.op:focus-visible{background:rgba(184,160,106,.16)}
.op i{background:transparent;border-color:rgba(245,242,238,.35)}
.op[aria-selected="true"]{background:rgba(184,160,106,.14)}
.op[aria-selected="true"] .ico{color:var(--oro-c)}
.op[aria-selected="true"] i{background:var(--oro);border-color:var(--oro);color:var(--pizarra)}
.seg{background:rgba(245,242,238,.08)}
.seg button{color:rgba(245,242,238,.65)}
.seg button[aria-pressed="true"]{background:rgba(245,242,238,.16);color:var(--oro-c);box-shadow:inset 0 0 0 1px rgba(184,160,106,.45),0 4px 10px -4px rgba(0,0,0,.5)}
.gift{background:rgba(184,160,106,.14);border-color:rgba(184,160,106,.5);color:var(--marfil)}
.gift .ico{color:var(--oro-c)}
.hint,.f .note,.legal{color:rgba(245,242,238,.62)}
.hint b{color:var(--oro-c)}

function bgInit(){
  const g=$('#bgi');if(!g)return;
  g.innerHTML='<div class="bgl iso on" data-k=""></div>';
  Object.keys(IC).forEach(k=>{const d=document.createElement('div');d.className='bgl';d.dataset.k=k;d.style.setProperty('--c',IC[k][0]);d.innerHTML=`<svg viewBox="0 0 24 24">${IC[k][1]}</svg>`;g.append(d)});
}
function bgSet(k){
  const g=$('#bgi');if(!g)return;
  $$('.bgl',g).forEach(x=>x.classList.toggle('on',x.dataset.k===(k||'')));
  
}

function setTipo(t){
  F.tipo=t;F.servicio='';F.multi=[];F.sub='';F.otro='';
  const emp=t==='empresa',n=parseFloat(INFO.descuento);
  $$('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t)));
  ['emp','pais','cargo'].forEach(k=>$('#w-'+k).hidden=!emp);$('#w-nom').classList.toggle('span',!emp);
  $('#gift').innerHTML=!emp&&(n>0||!INFO.ok)?`<div class="gift"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v9H5v-9M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg><span>Recibes ${n>0?n+'% de descuento':'un descuento'}: uno para ti y otro para un amigo</span></div>`:'<div class="gift"><span>Tu opinión nos ayuda a seguir creando</span></div>';
  $('#l-prod').textContent=emp?'¿Qué servicios prestamos? (puedes elegir varios)':'¿Qué servicio prestamos?';
  $('#l-txt').textContent='Tu comentario';
  $('#f-txt').placeholder=emp?'¿Cómo fue trabajar con nosotros y qué resultado obtuvieron?':'¿Qué fue lo que más te gustó?';
  $('#dd').classList.toggle('single',!emp);
  $('#dd-p').innerHTML=SERV[t].map(s=>`<button type="button" class="op" role="option" aria-selected="false" data-s="${esc(s)}">${ico(s)}<span>${esc(s)}</span><i>✓</i></button>`).join('')+'<div class="otro" id="rv-otro"><input id="f-otro" maxlength="60" aria-label="Cuéntanos qué fue" placeholder="Cuéntanos qué fue" autocomplete="off"></div>';
  $('#rv-otro').classList.remove('on');$('#rv-sub').classList.remove('on');$('#f-sub').value='';
  cierra();pintaDD();bgSet('');
}
function pintaDD(){
  const sel=F.tipo==='empresa'?F.multi:(F.servicio?[F.servicio]:[]);
  $('#dd-v').innerHTML=sel.length?sel.map(s=>`<span class="tg">${ico(s)}${esc(s==='Otro'&&F.otro.trim()?F.otro.trim():s)}</span>`).join(''):'<span class="ph">Elige una opción</span>';
  $$('.op').forEach(o=>o.setAttribute('aria-selected',String(sel.includes(o.dataset.s))));
  $('#rv-otro').classList.toggle('on',sel.includes('Otro'));
  const mus=F.tipo==='individual'&&F.servicio==='Producción musical';
  $('#rv-sub').classList.toggle('on',mus);if(!mus){F.sub='';$('#f-sub').value=''}
}
function abre(){const d=$('#dd');d.classList.add('open');$('#dd-b').setAttribute('aria-expanded','true');const p=$('#dd-p');p.classList.remove('up');const r=p.getBoundingClientRect();if(r.bottom>innerHeight-8&&$('#dd').getBoundingClientRect().top>r.height+20)p.classList.add('up')}
function cierra(){const d=$('#dd');if(!d)return;d.classList.remove('open');$('#dd-b').setAttribute('aria-expanded','false')}

let stars=[];
function pintaE(n){stars.forEach((s,i)=>{s.classList.toggle('on',i<n);s.setAttribute('aria-checked',String(i+1===F.estrellas))});$('#slab').textContent=ETI[n]||''}
function luz(n){
  $$('.grp').filter(el=>el.offsetParent).forEach((el,i)=>{el.style.setProperty('--d',i*110+'ms');el.style.setProperty('--g',n/5);el.classList.remove('luz');void el.offsetWidth;el.classList.add('luz')});
}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='f-otro'){F.otro=e.target.value;pintaDD()}});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='f-otro'&&e.key==='Enter'){e.preventDefault();cierra()}});
function ligar(){
  stars=$$('.star');
  $$('.seg button').forEach(b=>b.onclick=()=>{if(F.tipo!==b.dataset.t)setTipo(b.dataset.t)});
  $('#f-emp').oninput=e=>{F.empresa=e.target.value;e.target.classList.remove('need')};
  $('#f-nom').oninput=e=>{F.nombre=e.target.value;e.target.classList.remove('need');$('#e2').textContent=''};
  $('#f-pais').onchange=e=>{F.pais=e.target.value};
  $('#f-cargo').oninput=e=>{F.cargo=e.target.value};
  $('#dd-b').onclick=()=>$('#dd').classList.contains('open')?cierra():abre();
  document.addEventListener('click',e=>{if(!e.target.closest('#dd'))cierra()});
  $('#dd').addEventListener('keydown',e=>{if(e.key==='Escape'){cierra();$('#dd-b').focus()}});

    const b=e.target.closest('.op');if(!b)return;const v=b.dataset.s;
    if(F.tipo==='empresa'){const i=F.multi.indexOf(v);if(i<0)F.multi.push(v);else F.multi.splice(i,1);F.servicio=F.multi.join(', ');bgSet(F.multi.length?F.multi[F.multi.length-1]:'')}
    else{F.servicio=v;bgSet(v);if(v!=='Otro')cierra()}
    $('#dd-b').classList.remove('need');$('#e3').textContent='';pintaDD();
    if(v==='Otro'&&$('#rv-otro').classList.contains('on')){const pp=$('#dd-p');pp.scrollTop=pp.scrollHeight;setTimeout(()=>{$('#f-otro').focus({preventScroll:true});pp.scrollTop=pp.scrollHeight},120)}
  };
  $('#f-sub').onchange=e=>{F.sub=e.target.value;e.target.classList.remove('need');$('#e3').textContent=''};
  $('#f-otro').oninput=e=>{F.otro=e.target.value};
  stars.forEach((s,i)=>{
    s.onclick=()=>{F.estrellas=i+1;pintaE(F.estrellas);luz(F.estrellas);$('#e4').textContent='';stars.forEach(x=>x.classList.remove('pop'));void s.offsetWidth;s.classList.add('pop')};
    s.onmouseenter=()=>pintaE(i+1);s.onfocus=()=>pintaE(i+1);
    s.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();F.estrellas=Math.min(5,(F.estrellas||0)+1);pintaE(F.estrellas);stars[F.estrellas-1].focus()}else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();F.estrellas=Math.max(1,(F.estrellas||2)-1);pintaE(F.estrellas);stars[F.estrellas-1].focus()}};
  });
  $('.stars').onmouseleave=()=>pintaE(F.estrellas);
  $('.stars').addEventListener('focusout',()=>setTimeout(()=>{if(!$('.stars').contains(document.activeElement))pintaE(F.estrellas)},0));
  $('#f-txt').oninput=e=>{F.texto=e.target.value;e.target.classList.remove('need');$('#e5').textContent=''};
  $('#f-mej').oninput=e=>{F.mejora=e.target.value};
  $('#send').onclick=enviar;
}

function validar(){
  const e={},m=(sel,on)=>{const n=$(sel);if(n)n.classList.toggle('need',!!on)};
  const emp=F.tipo==='empresa',mus=!emp&&F.servicio==='Producción musical';
  const bad={'#f-emp':emp&&F.empresa.trim().length<1,'#f-nom':F.nombre.trim().length<2,'#dd-b':emp?!F.multi.length:!F.servicio,'#f-sub':mus&&!F.sub,'#f-txt':F.texto.trim().length<10};
  Object.keys(bad).forEach(k=>m(k,bad[k]));
  if(bad['#f-emp'])e.e2='Escribe el nombre de la empresa.';
  else if(bad['#f-nom'])e.e2='Escribe tu nombre.';
  if(bad['#dd-b'])e.e3=emp?'Elige qué servicios prestamos.':'Elige qué servicio prestamos.';
  else if(bad['#f-sub'])e.e3='Elige el tipo de proyecto musical.';
  if(!F.estrellas)e.e4='Toca las estrellas para puntuarnos.';
  if(bad['#f-txt'])e.e5='Cuéntanos un poco más (una frase basta).';
  return e;
}


async function enviar(){
  const er=validar();['e1','e2','e3','e4','e5'].forEach(k=>{const n=$('#'+k);if(n)n.textContent=er[k]||''});
  const prim=Object.keys(er)[0];
  if(prim)return;
  const b=$('#send');b.disabled=true;b.querySelector('span').textContent='Enviando…';$('#te').innerHTML='';
  const emp=F.tipo==='empresa',otro=F.otro.trim().slice(0,60);
  const ser=emp?F.multi.map(x=>x==='Otro'&&otro?otro:x).join(', '):(F.servicio==='Otro'&&otro?otro:F.servicio);
  const cat=emp?F.multi.join('|'):F.servicio;
  try{
    const r=await rpc('rs_enviar_publico',{p_tipo:F.tipo,p_empresa:F.tipo==='empresa'?F.empresa.trim():'',p_nombre:F.nombre.trim(),p_servicio:ser,p_estrellas:F.estrellas,p_texto:F.texto.trim(),p_mejora:F.mejora.trim(),p_categoria:cat,p_subtipo:F.sub,p_pais:emp?F.pais:'',p_cargo:emp?F.cargo.trim():''});
    if(r&&r.ok){const d={tipo:F.tipo,codigo:r.codigo||'',descuento:r.descuento||'',condicion:r.condicion||'',vence:r.vence||'',nombre:F.nombre.trim().split(/\s+/)[0]};ls(LSK,d);vistaGracias(d,true);return}
    const msg={limite:'Hay muchos comentarios llegando en este momento. Inténtalo de nuevo en unos minutos.',repetido:'Ya recibimos este mismo comentario. ¡Gracias!'}[r&&r.error];
    if(msg){b.disabled=false;b.querySelector('span').textContent='Enviar mi comentario';$('#te').innerHTML='<div class="top-err">'+msg+'</div>';return}
    throw new Error('x');
  }catch(x){
    b.disabled=false;b.querySelector('span').textContent='Enviar mi comentario';
    $('#te').innerHTML='<div class="top-err">No se pudo enviar. Revisa tu conexión e inténtalo de nuevo; lo que escribiste sigue aquí.</div>';
  }
}

async function cuponPNG(d){
  const W=1080,H=640,n=parseFloat(d.descuento);
  const logo=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='doc-logo.png'});
  try{await document.fonts.load('400 40px Lato')}catch(e){}
  const dibuja=conLogo=>{
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#a3243a');g.addColorStop(.55,'#8B1A2A');g.addColorStop(1,'#6e1321');x.fillStyle=g;x.fillRect(0,0,W,H);
    x.strokeStyle='rgba(224,205,154,.5)';x.lineWidth=2;x.strokeRect(28,28,W-56,H-56);
    const dx=Math.round(W*.68);x.setLineDash([9,11]);x.strokeStyle='rgba(245,242,238,.32)';x.beginPath();x.moveTo(dx,64);x.lineTo(dx,H-64);x.stroke();x.setLineDash([]);
    const F='Lato, system-ui, sans-serif';
    x.fillStyle='#E0CD9A';x.font='400 24px '+F;try{x.letterSpacing='5px'}catch(e){}x.fillText('TU CÓDIGO DE AGRADECIMIENTO',72,118);
    x.fillStyle='#F5F2EE';let fs=104;x.font='400 '+fs+'px '+F;try{x.letterSpacing='3px'}catch(e){}while(x.measureText(d.codigo).width>dx-72-40&&fs>40){fs-=4;x.font='400 '+fs+'px '+F}x.fillText(d.codigo,70,262);
    try{x.letterSpacing='0px'}catch(e){}
    x.fillStyle='#f1dfe0';x.font='400 30px '+F;x.fillText('1 uso para ti y 1 uso para un amigo',72,336);
    if(d.vence){x.fillStyle='#E0CD9A';x.fillText('Válido hasta el '+fvence(d.vence),72,384)}
    x.textAlign='center';const cx=dx+(W-dx)/2;
    x.fillStyle='#E0CD9A';x.font='400 '+(n>0?150:70)+'px '+F;x.fillText(n>0?n+'%':'REGALO',cx,n>0?330:320);
    x.fillStyle='#f1dfe0';x.font='400 24px '+F;try{x.letterSpacing='5px'}catch(e){}x.fillText(n>0?'DE DESCUENTO':'PARA TI',cx,376);
    x.textAlign='left';try{x.letterSpacing='0px'}catch(e){}
    if(conLogo&&logo){const h=92,w=h*logo.width/logo.height;x.drawImage(logo,72,H-72-h,w,h)}
    return c.toDataURL('image/png');
  };
  try{return dibuja(true)}catch(e){return dibuja(false)}
}

  document.body.append(m);document.documentElement.classList.add('mg-open');

  m.addEventListener('click',e=>{if(e.target.closest('[data-x]'))cierraModal()});
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){cierraModal();document.removeEventListener('keydown',k)}});
  $('#mg-wa').href='https://wa.me/?text='+encodeURIComponent(share);
  $('#mg-cp').onclick=async()=>{const b=$('#mg-cp');try{await navigator.clipboard.writeText(cod)}catch(e){const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r)}b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar',1800)};
  try{const url=await cuponPNG(d);$('#mg-img').src=url;$('#mg-dl').href=url}catch(e){$('#mg-img').remove();$('#mg-dl').remove()}
}

function confeti(){
  const c=$('#cf'),x=c.getContext('2d');c.hidden=false;const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
  const col=['#B8A06A','#E0CD9A','#8B1A2A','#D98A96','#F5F2EE'],P=Array.from({length:110},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.28,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,w:5+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:col[(Math.random()*col.length)|0]}));
  let t=0;(function f(){t++;x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.22;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-t/170);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(t<170)requestAnimationFrame(f);else{x.clearRect(0,0,innerWidth,innerHeight);c.hidden=true}})();
}
